<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>EveFL</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div id="app">
    <aside id="rail">
      <a class="brand" href="#/" aria-label="EveFL home">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-text"><strong>EveFL</strong><small>quantum channel-aware<br>federated learning</small></span>
      </a>
      <nav id="nav" aria-label="Main"></nav>
      <div class="rail-foot">Final-year major project<br>Atria Institute of Technology</div>
    </aside>
    <div id="main">
      <header id="topbar">
        <div id="page-title" class="page-title"></div>
        <div class="top-actions"><span id="health" class="pill pill-muted">checks not run yet</span></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#fff">This demonstration needs JavaScript.</p></noscript>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
