[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evefl"
version = "0.1.0"
description = "Quantum-aware adaptive orchestration for Federated Learning security"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["evefl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
